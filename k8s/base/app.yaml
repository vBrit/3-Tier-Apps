apiVersion: apps/v1
kind: Deployment
metadata:
  name: three-tier-app
  namespace: three-tier-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: three-tier-app
  template:
    metadata:
      labels:
        app: three-tier-app
    spec:
      containers:
        - name: app
          image: ghcr.io/your-org/three-tier-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: three-tier-db
            - name: DB_PORT
              value: "8080"
---
apiVersion: v1
kind: Service
metadata:
  name: three-tier-app
  namespace: three-tier-app
spec:
  selector:
    app: three-tier-app
  ports:
    - name: http
      port: 8080
      targetPort: 8080
