apiVersion: apps/v1
kind: Deployment
metadata:
  name: three-tier-web
  namespace: three-tier-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: three-tier-web
  template:
    metadata:
      labels:
        app: three-tier-web
    spec:
      containers:
        - name: web
          image: ghcr.io/your-org/three-tier-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: three-tier-web
  namespace: three-tier-app
spec:
  selector:
    app: three-tier-web
  ports:
    - name: http
      port: 80
      targetPort: 8080
